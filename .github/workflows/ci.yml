name: CI

on:
  pull_request:

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    permissions:
      contents: read

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: blog
          POSTGRES_PASSWORD: blog
          POSTGRES_DB: blog_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U blog -d blog_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      mailpit:
        image: axllent/mailpit
        env:
          MP_SMTP_DISABLE_RDNS: 'true'
        ports:
          - 1025:1025
          - 8025:8025
        options: >-
          --health-cmd "/mailpit readyz"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://blog:blog@localhost:5432/blog_test
      DATABASE_URL_TEST: postgresql://blog:blog@localhost:5432/blog_test
      REDIS_URL: redis://localhost:6379
      SMTP_HOST: 127.0.0.1
      SMTP_PORT: 1025
      MAIL_FROM: noreply@blog.local
      MAILPIT_API_URL: http://127.0.0.1:8025
      UPLOADS_DIR: uploads-test
      # Placeholders: o app instancia os gateways no import. Os specs que chamam a API ficam de fora.
      STRIPE_SECRET_KEY: sk_test_ci
      STRIPE_PRICE_ID: price_ci
      STRIPE_SUCCESS_URL: http://localhost:3001/
      STRIPE_CANCEL_URL: http://localhost:3001/
      STRIPE_WEBHOOK_SECRET: whsec_ci

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Migrate database
        run: npm run db:migrate

      - name: Run tests
        run: npm test -- --exclude tests/me/checkout.spec.ts --exclude tests/webhook/stripe.spec.ts
