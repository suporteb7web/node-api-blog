services:
  db:
    image: postgres:17
    container_name: node-api-blog-db
    restart: unless-stopped
    ports:
      - '6000:5432'
    environment:
      POSTGRES_USER: blog
      POSTGRES_PASSWORD: blog
      POSTGRES_DB: blog
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U blog -d blog']
      interval: 5s
      timeout: 5s
      retries: 5

  db-test:
    image: postgres:17
    container_name: node-api-blog-db-test
    restart: unless-stopped
    ports:
      - '6001:5432'
    environment:
      POSTGRES_USER: blog
      POSTGRES_PASSWORD: blog
      POSTGRES_DB: blog_test
    volumes:
      - pgdata_test:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U blog -d blog_test']
      interval: 5s
      timeout: 5s
      retries: 5

  mailpit:
    image: axllent/mailpit
    container_name: node-api-blog-mailpit
    restart: unless-stopped
    ports:
      - '1025:1025'
      - '8025:8025'
    environment:
      MP_SMTP_DISABLE_RDNS: 'true'
    healthcheck:
      test: ['CMD', '/mailpit', 'readyz']
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7
    container_name: node-api-blog-redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - redisdata:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 5

  bullboard:
    image: ghcr.io/felixmosh/bull-board:9
    container_name: node-api-blog-bullboard
    restart: unless-stopped
    command: --redis redis://redis:6379
    environment:
      BULL_BOARD_USER: blog
      BULL_BOARD_PASSWORD: blog
    ports:
      - '127.0.0.1:3001:3000'
    depends_on:
      redis:
        condition: service_healthy

volumes:
  pgdata:
  pgdata_test:
  redisdata:
